<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <filter id="poster-grain-tile" filterUnits="objectBoundingBox" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="1.35" numOctaves="2" stitchTiles="stitch" seed="1737" result="noise"/>
    <feColorMatrix in="noise" type="luminanceToAlpha" result="alphaNoise"/>
    <feComponentTransfer in="alphaNoise" result="softNoise">
      <feFuncA type="gamma" amplitude="0.35" exponent="2.4" offset="0"/>
    </feComponentTransfer>
    <feFlood flood-color="#FFFFFF" flood-opacity="0.22" result="grainFlood"/>
    <feComposite in="grainFlood" in2="softNoise" operator="in" result="grain"/>
  </filter>
  <rect width="128" height="128" fill="transparent" filter="url(#poster-grain-tile)"/>
</svg>
