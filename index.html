<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MD Gallery</title>
  <meta name="description" content="Drop a Markdown file and read it as an editorial poster gallery. Search and table of contents included.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link id="fonts-link" rel="stylesheet" href="">
  <link rel="stylesheet" href="assets/site.css">
  <link rel="stylesheet" href="assets/reader.css">
  <script>
    if (localStorage.getItem('md-gallery-theme') === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  </script>
</head>
<body id="app">
  <a class="skip-link" href="#main">Skip to content</a>

  <section class="page-landing" id="landing" aria-label="Open a Markdown file">
    <header class="site-header">
      <div class="header-inner">
        <span class="brand"><span class="brand-mark">◆</span> MD Gallery</span>
        <div class="app-chrome-actions" role="group" aria-label="View options">
          <button type="button" class="btn-icon btn-ghost theme-toggle" id="theme-toggle" aria-label="Dark mode" aria-pressed="false">
            <span class="theme-toggle__icons" aria-hidden="true"></span>
          </button>
        </div>
      </div>
    </header>
    <main class="landing-main" id="main">
      <div class="landing-shell">
        <div class="landing-hero-wrap">
          <label class="drop-zone" id="drop-zone">
            <input type="file" id="file-input" accept=".md,.markdown,.txt,text/markdown,text/plain">
            <h1 class="drop-zone__title">Drop a Markdown file</h1>
            <p class="drop-zone__hint mono-label">Or click to browse, or drop a folder to pick a file.<br>Stays on your device.</p>
          </label>
        </div>
        <div class="landing-featured" id="landing-featured" aria-label="Quick start"></div>
        <div id="landing-gallery" class="landing-gallery" hidden>
          <div class="landing-gallery__head">
            <p class="landing-gallery__count mono-label" id="landing-gallery-count"></p>
            <button type="button" class="btn-ghost landing-gallery__back" id="landing-gallery-back">Drop another file</button>
          </div>
          <div id="landing-gallery-grid" class="landing-gallery__grid landing-mini-grid" role="list"></div>
        </div>
      </div>
    </main>
    <footer class="landing-foot mono-label">
      <div class="landing-foot__row">
        <p class="landing-foot__lead">Posters split on <code>##</code> headings</p>
        <p class="landing-foot__meta">
          <a href="https://github.com/arashr/md-gallery" rel="noopener noreferrer">GitHub</a>
          <span class="landing-foot__sep" aria-hidden="true">·</span>
          <a href="LICENSE">MIT</a>
          <span class="landing-foot__sep" aria-hidden="true">·</span>
          <span class="landing-foot__credit">Arash Ranjbaran</span>
        </p>
      </div>
    </footer>
  </section>

  <section class="page-reader" id="reader" hidden aria-label="Document reader">
    <header class="site-header site-header--reader">
      <div class="header-inner">
        <span class="brand brand--reader"><span class="brand-mark">◆</span> <span id="doc-label">MD Gallery</span></span>
        <div class="reader-actions">
          <button type="button" class="btn-ghost btn-with-icon" id="open-another">
            <span class="btn-icon-slot" data-icon="folderOpen" aria-hidden="true"></span>
            <span class="btn-label">Open file</span>
          </button>
          <nav class="nav nav--highlight" aria-label="Highlight in document">
            <label class="nav-search-wrap">
              <span class="visually-hidden">Highlight</span>
              <span class="nav-search-icon" data-icon="highlight" aria-hidden="true"></span>
              <input type="text" id="search-input" class="nav-search-input" placeholder="Highlight…" autocomplete="off" spellcheck="false">
              <button type="button" class="nav-highlight-clear btn-icon btn-ghost" id="highlight-clear" aria-label="Clear highlight" hidden>
                <span data-icon="xmark" aria-hidden="true"></span>
              </button>
            </label>
          </nav>
          <div class="reader-controls" role="group" aria-label="View options">
            <button type="button" class="btn-icon btn-ghost" id="zoom-out" aria-label="Zoom out">
              <span data-icon="zoomOut" aria-hidden="true"></span>
            </button>
            <button type="button" class="btn-icon btn-ghost" id="zoom-in" aria-label="Zoom in">
              <span data-icon="zoomIn" aria-hidden="true"></span>
            </button>
            <button type="button" class="btn-icon btn-ghost theme-toggle" aria-label="Dark mode" aria-pressed="false">
              <span class="theme-toggle__icons" aria-hidden="true"></span>
            </button>
          </div>
          <div class="nav-toc-wrap">
            <button type="button" class="btn-ghost btn-with-icon" id="toc-toggle" aria-expanded="false" aria-controls="toc-panel">
              <span class="btn-icon-slot" data-icon="list" aria-hidden="true"></span>
              <span class="btn-label">Contents</span>
            </button>
            <div class="toc-panel" id="toc-panel" role="navigation" aria-label="Table of contents">
              <p class="toc-panel__label">Contents</p>
              <div id="toc-root"></div>
            </div>
          </div>
        </div>
      </div>
    </header>
    <main id="main-reader" class="content-feed collection-feed"></main>
    <button type="button" id="back-to-top" class="back-to-top" aria-label="Back to top">↑</button>
  </section>

  <script src="node_modules/jspdf/dist/jspdf.umd.min.js"></script>
  <script type="importmap">
  {
    "imports": {
      "marked": "./node_modules/marked/lib/marked.esm.js",
      "dompurify": "./node_modules/dompurify/dist/purify.es.mjs",
      "isomorphic-dompurify": "./node_modules/isomorphic-dompurify/dist/browser.mjs",
      "html2canvas": "./node_modules/html2canvas/dist/html2canvas.esm.js"
    }
  }
  </script>
  <script type="module" src="assets/reader.js"></script>
</body>
</html>
